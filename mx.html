<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Vitesse</title>
</head>
<body>
    <h2 id="status">Vérification...</h2>
    <h2 id="result"></h2>

    <script>
        let statusEl = document.getElementById("status");
        let resultEl = document.getElementById("result");

        function testSpeed() {
            const start = performance.now();
            // On charge une très petite image depuis un CDN rapide
            fetch('https://www.google.com/favicon.ico')
                .then(() => {
                    const end = performance.now();
                    const duration = end - start;
                    
                    if (duration < 100) {
                        statusEl.innerHTML = "Connexion : 🟢 Très Rapide";
                        resultEl.innerHTML = `Temps de réponse : ${Math.round(duration)} ms`;
                    } else if (duration < 500) {
                        statusEl.innerHTML = "Connexion : 🟡 Moyenne";
                        resultEl.innerHTML = `Temps de réponse : ${Math.round(duration)} ms`;
                    } else {
                        statusEl.innerHTML = "Connexion : 🔴 Lente";
                        resultEl.innerHTML = `Temps de réponse : ${Math.round(duration)} ms`;
                    }
                })
                .catch(err => {
                    statusEl.innerHTML = "Erreur de test";
                    resultEl.innerHTML = err.message;
                });
        }

        testSpeed();
    </script>
</body>
</html>
