<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de votre connexion</title>

    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #result {
            font-size: 3rem;
            text-align: center;
        }

        .label {
            font-size: 1rem;
            background: linear-gradient(
        90deg,
        #333 0%,
        #333 40%,
        #fff 50%,
        #333 60%,
        #333 100%
    );
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: shine 3s linear infinite;
}

@keyframes shine{
    from{
       background-position: 100% 0;
    }
    to{
        background-position: -50% 0;
    }
}

        .cn {
            color: white;
            overflow-x: auto;
            padding: 10px 19px;
            border: solid 2px white;
            border-radius: 4px;
            margin-top: 20px;
            max-width: 50vw;
            max-height: 50px;
            font-size: 1rem;
            word-wrap: break-word;
        }
        
        .rep{
            position: fixed;
            top: 20px;
            backdrop-filter: blur(5px);
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            border: solid 2px black;
        }
    </style>
</head>
<body>
    <center>
        <h2 id="rep" class="rep"></h2>
    </center>

    <div id="result">
        <div class="label">Temps de réponse entre<br> vous et internet.</div>
        <span id="ms-val">Calcul en cours...</span>
        <center>
        <div class="cn" id="cn">
            <span id="log"></span>
        </div>
        </center>
    </div>

    <script>
        async function testSpeed() {
            const start = performance.now();

            try {
                await fetch("https://www.cloudflare.com/cdn-cgi/trace", {
                    cache: "no-store"
                });

                const end = performance.now();
                const latency = Math.round(end - start);

                document.getElementById("ms-val").innerText =
                    `${latency}/ms`;
                const cn = document.getElementById("cn");
                const log = document.getElementById("log");
                log.innerHTML += `${latency}/ms ${new Date().toLocaleTimeString()} ` + "<br>";
                cn.scrollTo({
                    top:
                    cn.scrollHeight, behavior: "smooth"
                });

                if (latency < 50) {
                    document.body.style.color = "#0f0";
                    document.getElementById("rep").innerText = "Votre connexion est rapide."
                    document.getElementById("rep").style.color = "white"
                    log.style.color = "white"
                } else if (latency < 150) {
                    document.body.style.color = "#ff0";
                    document.getElementById("rep").innerText = "Connexion assez lente."
                    document.getElementById("rep").style.color = "orange"
                    log.style.color = "orange"
                } else {
                    document.body.style.color = "#f00";
                    document.getElementById("rep").innerText = "Vérifiez votre réseaux, car la réponse est lente."
                    document.getElementById("rep").style.color = "red"
                    log.style.color = "red"
                }

            } catch (e) {
                document.getElementById("ms-val").innerText = "Erreur";
                console.error(e);
            }
        }

        testSpeed();
        setInterval(testSpeed, 500);
    </script>

</body>
</html>
