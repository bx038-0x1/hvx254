<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Rapidité connection</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #result {
            font-size: 3rem;
            text-align: center;
        }
        .label {
            font-size: 1rem;
            color: #333;
        }
    </style>
</head>
<body>

    <div id="result">
        <div class="label">Temp de réponse</div>
        <span id="ms-val">Calcul en cours...</span>
    </div>
    

    <script>
        async function testSpeed() {
            const start = performance.now();
            
            try {
                await fetch('https://www.cloudflare.com/cdn-cgi/trace');
                
                const end = performance.now();
                const latency = Math.round(end - start);
                
                
                document.getElementById('ms-val').innerText = latency + "/ms";
                if(latency < 50) document.body.style.color = "#FFF";
                else if(latency < 150) document.body.style.color = "#ff0"; document.
                else document.body.style.color = "#f00";

            } catch (e) {
                document.getElementById('ms-val').innerText = "Erreur";
            }
        }
        testSpeed();

        
        setInterval(testSpeed, 500);
    </script>

</body>
</html>
