<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mesurez la latence de votre connexion Internet en temps réel.">
<meta name="keywords" content="ping, latence, internet, connexion, speedtest">
<meta name="author" content="HxD3v">
<meta property="og:type" content="website">
<meta property="og:title" content="Test de Latence Internet">
<meta property="og:description" content="Mesurez la latence de votre connexion en temps réel.">
<meta property="og:url" content="https://hvxsrc.online/mx">
<meta property="og:image" content="https://hvxsrc.online/lzar.gif">
<meta property="og:Vitesse2Connexion" content="Latence test">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Test de Latence Internet">
<meta name="twitter:description" content="Mesurez la latence de votre connexion en temps réel.">
<meta name="twitter:image" content="https://hvxsrc.online/lzar.gif">
<meta name="twitter:url" content="https://hvxsrc.online/mx">
<meta name="theme-color" content="#000000">
    <title>Test de votre connexion</title>

    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #result {
            font-size: 3rem;
            text-align: center;
        }

        .label {
            font-size: 1rem;
            background: linear-gradient(
        90deg,
        #333 0%,
        #333 40%,
        #fff 50%,
        #333 60%,
        #333 100%
    );
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: shine 3s linear infinite;
}

@keyframes shine{
    from{
       background-position: 100% 0;
    }
    to{
        background-position: -50% 0;
    }
}

        .cn {
            color: white;
            overflow-x: auto;
            padding: 10px 19px;
            border: solid 2px white;
            border-radius: 4px;
            margin-top: 20px;
            max-width: 60vw;
            max-height: 60px;
            font-size: 1rem;
            word-wrap: break-word;
        }
        
        .rep{
            background-color: #333;
            padding: 13px 22px;
            -webkit-backdrop-filter: blur(5px);
            border-radius: 6px;
            border: solid 2px aaa;
            position: fixed;
            top: 20px;
        }
        
        .cx {
            color: white;
            overflow-x: auto;
            padding: 10px 19px;
            border: solid 2px red;
            border-radius: 4px;
            margin-top: 20px;
            max-width: 80vw;
            max-height: 70px;
            font-size: 1rem;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <center>
        <h2 id="rep" class="rep"></h2>
    </center>

    <div id="result">
        <div class="label">Temp de réponse entre<br> vous et internet.</div>
        <span id="ms-val">Calcul en cours...</span>
        <center>
        <div class="cn" id="cn">
            <span id="log"></span>
        </div>
        <hr>
        <p style="color: red; font-size: 15px;">Tableau d'alertes</p>
        <div class="cx" id="cx">
            <span id="enre"></span>
        </div>
        <br>
            <div style="color: white;">
                <span style="font-size: 15px;" id="min"></span><span style="font-size: 15px;" id="max"></span>
            </div>
        </center>
    </div>

    <script>
        async function testSpeed() {
            const start = performance.now();

            try {
                await fetch("https://www.cloudflare.com/cdn-cgi/trace", {
                    cache: "no-store"
                });

                const end = performance.now();
                const latency = Math.round(end - start);

                document.getElementById("ms-val").innerText =
                    `${latency}/ms`;
                const cn = document.getElementById("cn");
                const cx = document.getElementById("cx");
                const log = document.getElementById("log");
                log.innerHTML += `${latency}/ms ${new Date().toLocaleTimeString()} ` + "<br>";
                cn.scrollTo({
                    top:
                    cn.scrollHeight, behavior: "smooth"
                });
                cx.scrollTo({
                    top:
                    cx.scrollHeight, behavior: "smooth"
                });
                    
                if (latency < 24) {
                    document.getElementById("min").innerHTML = "Min: " + `${latency}`
                    }
                if (latency < 50) {
                    document.body.style.color = "#0f0";
                    document.getElementById("rep").innerText = "Votre connexion est rapide. :D"
                    document.getElementById("rep").style.color = "white"
                    log.style.color = "white"
                } else if (latency < 150) {
                    document.body.style.color = "#ff0";
                    document.getElementById("rep").innerText = "Connexion assez lente. :/"
                    document.getElementById("rep").style.color = "orange"
                    log.style.color = "orange"
                    document.getElementById("enre").innerHTML += "Pic de " + `${latency}` + "/ms a " + `${new Date().toLocaleTimeString()}` + "<br>"
                } else if (latency > 150) {
                    document.getElementById("max").innerHTML = "Max: " + `${latency}`
                    }
                  else {
                    document.body.style.color = "#f00";
                    document.getElementById("rep").innerText = "Vérifiez votre réseaux, car la réponse est lente. x("
                    document.getElementById("rep").style.color = "red"
                    log.style.color = "red"
                    document.getElementById("enre").innerHTML += "Pic de " + `${latency}` + "/ms a " + `${new Date().toLocaleTimeString()}` + "<br>"
                }

            } catch (e) {
                document.getElementById("ms-val").innerText = "Erreur";
                console.error(e);
            }
        }

        testSpeed();
        setInterval(testSpeed, 500);
    </script>

</body>
</html>
