<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Lecture Loi - User Agent Fix</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        button { background: #2c3e50; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; }
        button:hover { background: #34495e; }
        #resultat { margin-top: 20px; line-height: 1.6; white-space: pre-wrap; max-width: 800px; border-left: 3px solid #2c3e50; padding-left: 15px; display: none; }
        .err { color: #e74c3c; font-weight: bold; }
        .loading { color: #f39c12; }
    </style>
</head>
<body>
    <h1>Article L. 225-1 du Code Pénal</h1>
    <button onclick="charger()">Charger l'article</button>
    
    <div id="resultat"></div>

    <script>
        function charger() {
            const div = document.getElementById("resultat");
            div.style.display = "block";
            div.innerHTML = "<span class='loading'>Chargement...</span>";

            const articleId = "LEGIARTI000038382940";
            
            // On utilise un proxy CORS fiable qui permet de passer des headers personnalisés
            // L'URL encode l'adresse cible
            const targetUrl = `https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI${articleId}`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) throw new Error("Erreur réseau");
                    return response.json(); // Le proxy retourne du JSON avec le contenu dans "contents"
                })
                .then(data => {
                    if (!data.contents) throw new Error("Contenu vide reçu du proxy");

                    // Création d'un faux DOM pour extraire le texte proprement
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data.contents, 'text/html');
                    
                    // Nettoyage : on supprime les éléments inutiles
                    doc.querySelectorAll('script, style, nav, header, footer, .menu, .navigation').forEach(el => el.remove());
                    
                    // Extraction du texte
                    // On cherche spécifiquement le conteneur de l'article si possible, sinon tout le body
                    const container = doc.querySelector('#article-texte') || doc.body;
                    const text = container.innerText;

                    if (text.trim().length > 0) {
                        div.textContent = text;
                    } else {
                        div.innerHTML = "<span class='err'>Texte extrait mais semble vide.</span>";
                    }
                })
                .catch(error => {
                    div.innerHTML = `<span class='err'>Erreur : ${error.message}</span>`;
                    console.error(error);
                });
        }
    </script>
</body>
</html>
